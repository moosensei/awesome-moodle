# Turns "Add a resource" issues into pull requests.
#
# Security:
# - The issue body is untrusted data. scripts/submission.py reads it from the event
#   file; it is never interpolated into shell commands.
# - On issues events the workflow and scripts always come from the default branch,
#   so a submitter cannot change the bot's code.
# - The bot only changes README.md on branch submission/issue-<N> and cannot touch
#   workflows: neither the app token nor GITHUB_TOKEN has the workflows permission.
# - When a GitHub App is configured (variable BOT_CLIENT_ID and secret BOT_PRIVATE_KEY),
#   the bot acts as the app and CI runs on its pull requests. Otherwise it falls back
#   to GITHUB_TOKEN (see docs/MAINTAINING.md).
# - A human always merges.
name: Submission bot

on:
  issues:
    types: [opened, edited, reopened, labeled]

permissions: {}

jobs:
  process:
    name: Check submission
    if: >-
      contains(github.event.issue.labels.*.name, 'submission') &&
      (github.event.action != 'labeled' || github.event.label.name == 'maintainer-approved')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    concurrency:
      group: submission-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: GitHub App token
        id: app-token
        if: vars.BOT_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Process submission
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: python scripts/submission.py
