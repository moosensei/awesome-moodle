# Applies the contributor and link rules to pull requests opened directly.
#
# pull_request_target runs with a write token, so this workflow never checks out,
# builds, or runs code from the pull request. It runs the base branch's (trusted)
# code and reads the pull request only through the API.
name: PR guard

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] PR code is never checked out or run, see above.
    types: [opened, reopened, synchronize, edited]

permissions: {}

jobs:
  guard:
    name: Contributor and links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write # labels and the comment
      pull-requests: write # close pull requests that fail the contributor checks
    concurrency:
      group: pr-guard-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Check out the base branch (trusted code only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Check pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/pr_guard.py
